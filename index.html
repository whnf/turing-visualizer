<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive visualizer for deterministic single-tape Turing machines. Define states, symbols and transitions, then step through the run."
    />
    <title>Turing Visualizer</title>
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      const theme = JSON.parse(localStorage.getItem("turing-visualizer:theme"));
      document.documentElement.classList.toggle(
        "dark",
        theme === "dark" ||
          (theme === null &&
            matchMedia("(prefers-color-scheme: dark)").matches),
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
